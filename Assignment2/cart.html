<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Your Cart | Rosy Glow</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&family=Yeseva+One&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="bg-orbs" aria-hidden="true">
    <span></span><span></span><span></span>
  </div>

  <header class="site-header">
    <a class="logo" href="index.html">Rosy Glow</a>
    <nav class="nav">
      <a href="index.html">Home</a>
      <a href="shop.html">Shop</a>
      <a href="collections.html">Collections</a>
      <a href="index.html#story">Story</a>
      <a class="cart-link" href="cart.html">Cart <span id="cartCount" class="cart-count">0</span></a>
    </nav>
    <div class="toggles">
      <label class="toggle">
        <input id="themeToggle" type="checkbox" />
        <span>Blush Mode</span>
      </label>
      <label class="toggle">
        <input id="sparkleToggle" type="checkbox" checked />
        <span>Sparkle</span>
      </label>
    </div>
  </header>

  <main>
    <section class="section">
      <div class="section-title">
        <h2>Your Cart</h2>
        <p>Cozy picks ready to checkout.</p>
      </div>
      <div id="cartItems" class="cart-list"></div>
      <div class="cart-summary">
        <p>Total: <span id="cartTotal">$0</span></p>
        <button class="btn primary">Checkout</button>
      </div>
    </section>
  </main>

  <footer class="site-footer">
    <p class="mini">© 2026 Rosy Glow Jewelry. All rights reserved.</p>
  </footer>

  <script src="script.js"></script>
</body>
</html>
